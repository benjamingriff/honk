[package]
name = "honk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A read-only Athena and Iceberg command-line client"
publish = false

[dependencies]
aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-credential-types = "1.3.0"
aws-runtime = "1.9.1"
aws-sdk-athena = { version = "1.116.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-glue = { version = "1.160.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.110.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-types = "1.5.0"
clap = { version = "4.5.47", features = ["derive"] }
csv = "1.3"
humantime = "2.3.0"
serde_json = "1.0"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
tempfile = "3.21.0"
terminal_size = "0.4"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.5"

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
